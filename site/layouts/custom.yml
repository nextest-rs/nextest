definitions:
    - &page_title_with_site_name >-
        {%- if not page.is_homepage -%}
          {{ page.meta.get("title", page.title) }} - {{ config.site_name }}
        {%- else -%}
          {{ page.meta.get("title", page.title) }}
        {%- endif -%}

    - &page_icon >-
        {{ page.meta.get("icon", config.site_icon) or "" }}

    - &page_description >-
        {{ page.meta.get("description", config.site_description) or "" }}

# Render social images at 2x (2400x1260) because Pillow snaps each glyph to a
# whole pixel, which makes letter spacing visibly uneven at 1x.
size: { width: 2400, height: 1260 }
layers:
    - background:
          color: "#045"
    - size: { width: 1664, height: 100 }
      offset: { x: 124, y: 140 }
      typography:
          content: "cargo-nextest"
          align: start
          color: white
          font:
              family: Inter
              variant: 28pt
              style: SemiBold
    - size: { width: 1664, height: 620 }
      offset: { x: 124, y: 320 }
      typography:
          content: "{{ page.title }}"
          align: start
          color: white
          line:
              amount: 3
              height: 1.25
          font:
              family: Inter
              variant: 28pt
              style: Bold
    - size: { width: 1664, height: 220 }
      offset: { x: 124, y: 900 }
      typography:
          content: *page_description
          align: start
          color: white
          line:
              amount: 3
              height: 1.25
          font:
              family: Inter
              # The default Inter file is the opsz=14 text design and is too
              # loosely spaced at this size. Use the 28pt variant which looks a
              # lot nicer.
              variant: 28pt
              style: Regular
    - size: { width: 288, height: 288 }
      offset: { x: 1984, y: 128 }
      icon:
          value: *page_icon
          color: white

tags:
    og:type: website
    og:title: *page_title_with_site_name
    og:description: *page_description
    og:image: "{{ image.url }}"
    og:image:type: "{{ image.type }}"
    og:image:width: "{{ image.width }}"
    og:image:height: "{{ image.height }}"
    og:url: "{{ page.canonical_url }}"

    twitter:card: summary_large_image
    twitter:title: *page_title_with_site_name
    twitter:description: *page_description
    twitter:image: "{{ image.url }}"
