# Notes:
#
# - Render social images at 2x (2400x1260) because Pillow snaps each glyph to a
#   whole pixel, which makes letter spacing visibly uneven at 1x. All sizes and
#   offsets below are at 2x.
# - All text uses the Inter 28pt variant for better text spacing than the
#   default (14pt) variant.

definitions:
    - &page_title >-
        {%- if page.is_homepage -%}
          {{ config.site_name }}
        {%- else -%}
          {{ page.meta.get("title", page.title) }}
        {%- endif -%}

    - &page_title_with_site_name >-
        {%- if page.is_homepage -%}
          {{ config.site_name }}
        {%- else -%}
          {{ page.meta.get("title", page.title) }} - {{ config.site_name }}
        {%- endif -%}

    - &page_eyebrow >-
        {%- if page.is_homepage -%}
        {%- elif page.ancestors -%}
          {{ config.site_name }} · {{ page.ancestors[-1].title }}
        {%- else -%}
          {{ config.site_name }}
        {%- endif -%}

    - &page_icon >-
        {%- if page.is_homepage -%}
          {{ page.meta.get("icon", "material/test-tube") }}
        {%- else -%}
          {{ page.meta.get("icon", "") }}
        {%- endif -%}

    - &page_description >-
        {{ page.meta.get("description", config.site_description) or "" }}

    - &site_host >-
        {{ config.site_url | replace("https://", "") | replace("http://", "") | trim("/") }}

    # This matches --md-accent-fg-color for the slate scheme in
    # src/theme/css/extra.css.
    - &accent_color "hsl(350, 45%, 60%)"

size: { width: 2400, height: 1260 }
layers:
    - background:
          color: "#045"

    - size: { width: 1664, height: 72 }
      offset: { x: 128, y: 128 }
      typography:
          content: *page_eyebrow
          align: start
          color: "#ffffffb3"
          font:
              family: Inter
              variant: 28pt
              style: SemiBold

    # The box height sets the title font size (92px at 1x) -- keep roughly 10%
    # headroom over the longest unbreakable word since the plugin cannot break
    # inside a word and clips instead
    - size: { width: 1760, height: 428 }
      offset: { x: 128, y: 302 }
      typography:
          content: *page_title
          align: start bottom
          overflow: shrink
          color: white
          line:
              amount: 2
              height: 1.15
          font:
              family: Inter
              variant: 28pt
              style: Bold

    - size: { width: 160, height: 12 }
      offset: { x: 128, y: 786 }
      background:
          color: *accent_color

    - size: { width: 1664, height: 220 }
      offset: { x: 128, y: 846 }
      typography:
          content: *page_description
          align: start
          color: "#ffffffd9"
          line:
              amount: 3
              height: 1.3
          font:
              family: Inter
              variant: 28pt
              style: Regular

    - size: { width: 800, height: 48 }
      offset: { x: 128, y: 128 }
      origin: start bottom
      typography:
          content: *site_host
          align: start bottom
          color: "#ffffff80"
          font:
              family: Inter
              variant: 28pt
              style: Medium

    - size: { width: 288, height: 288 }
      offset: { x: 1984, y: 128 }
      icon:
          value: *page_icon
          color: white

tags:
    og:type: website
    og:title: *page_title_with_site_name
    og:description: *page_description
    og:image: "{{ image.url }}"
    og:image:type: "{{ image.type }}"
    og:image:width: "{{ image.width }}"
    og:image:height: "{{ image.height }}"
    og:url: "{{ page.canonical_url }}"

    twitter:card: summary_large_image
    twitter:title: *page_title_with_site_name
    twitter:description: *page_description
    twitter:image: "{{ image.url }}"
